<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | LifeVitals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="login">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">Dark</button>
    <div class="auth-shell">
        <section class="auth-card" style="max-width:480px;">
            <div class="brand">LifeVitals</div>
            <h1 class="page-title" style="margin-top:10px;">Sign in</h1>
            <p class="page-subtitle">Access your dashboard and prediction workspace.</p>

            <form id="login-form" class="grid" style="gap:12px;">
                <div>
                    <label for="login_email">Email</label>
                    <input id="login_email" type="email" required />
                </div>
                <div>
                    <label for="login_password">Password</label>
                    <input id="login_password" type="password" required />
                </div>
                <p id="login-error" class="error-text"></p>
                <button id="login-btn" class="btn btn-primary" type="submit">Login</button>
            </form>

            <p style="margin-top:14px;color:var(--muted);">No account? <a href="signup.html"
                    style="color:var(--primary);font-weight:600;">Create one</a></p>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
