<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | LifeVitals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="profile">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">Dark</button>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">LifeVitals</div>
            <a class="nav-link" data-nav="dashboard" href="dashboard.html">Dashboard</a>
            <a class="nav-link" data-nav="predict" href="predict.html">Predict</a>
            <a class="nav-link" data-nav="analytics" href="analytics.html">Analytics</a>
            <a class="nav-link" data-nav="map" href="map.html">World Map</a>
            <a class="nav-link" data-nav="history" href="history.html">History</a>
            <a class="nav-link" data-nav="profile" href="profile.html">Profile</a>
            <a class="nav-link" data-nav="feedback" href="feedback.html">Feedback</a>
            <a class="nav-link" href="#" data-logout>Logout</a>
        </aside>

        <main class="main">
            <h1 class="page-title">Profile & Settings</h1>
            <p class="page-subtitle">Manage your personal and health profile configuration.</p>

            <section class="card">
                <form id="profile-form" class="grid" style="gap:12px;">
                    <div class="form-row">
                        <div><label for="profile_full_name">Full Name</label><input id="profile_full_name" required />
                        </div>
                        <div><label for="profile_age">Age</label><input id="profile_age" type="number" required /></div>
                        <div><label for="profile_gender">Gender</label><input id="profile_gender" required /></div>
                        <div><label for="profile_country">Country</label><input id="profile_country" required /></div>
                        <div><label for="profile_height_cm">Height (cm)</label><input id="profile_height_cm"
                                type="number" required /></div>
                        <div><label for="profile_weight_kg">Weight (kg)</label><input id="profile_weight_kg"
                                type="number" required /></div>
                        <div><label for="profile_smoking_status">Smoking Status</label><input
                                id="profile_smoking_status" required /></div>
                        <div><label for="profile_alcohol_consumption">Alcohol Consumption</label><input
                                id="profile_alcohol_consumption" required /></div>
                        <div><label for="profile_physical_activity">Physical Activity</label><input
                                id="profile_physical_activity" required /></div>
                        <div><label for="profile_education_level">Education Level</label><input
                                id="profile_education_level" required /></div>
                        <div><label for="profile_occupation">Occupation</label><input id="profile_occupation"
                                required /></div>
                        <div><label for="profile_income_range">Income Range</label><input id="profile_income_range"
                                required /></div>
                        <div><label for="profile_user_role">User Role</label><input id="profile_user_role" required />
                        </div>
                    </div>
                    <button id="save-profile-btn" class="btn btn-primary" type="submit">Save Profile</button>
                </form>
            </section>

            <section class="card" style="margin-top:18px;">
                <h3 style="margin-top:0;">Security</h3>
                <p style="margin:0;color:var(--muted);">Password updates can be added via a dedicated endpoint. JWT
                    session security is active.</p>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
